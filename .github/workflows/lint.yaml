# GitHub Actions workflow for linting and style checking
# Checks code style using lintr

name: lint

on:
  push:
    branches: [main, master, claude/*]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::lintr
            any::styler
          needs: check

      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true

      - name: Check code style
        run: |
          styled <- styler::style_pkg(dry = "on")
          if (length(styled) > 0) {
            cat("The following files need styling:\n")
            print(styled)
            stop("Please run styler::style_pkg() to fix code style")
          }
        shell: Rscript {0}
